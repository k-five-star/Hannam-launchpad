<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dedbd4"><title>한남체 — 사운드패드</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./">한남체<span>사운드패드</span></a><span class="version">초안 02</span></header>
<div class="desk-note"><p>예? 엄. 아뇨아뇨아뇨.</p><span>눌러서 재생. 섞어서 연주.</span></div>
<section class="machine" aria-label="런치패드"><div class="toolbar"><div class="device-name"><i></i> HN–12 <span>VOICE SAMPLER</span></div><label>볼륨 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="볼륨"></label><button id="stop" class="small">정지 <kbd>esc</kbd></button></div>
<div class="bank-labels"><span>반응 / Q W E R</span><span>외침 / A S D F</span><span>말투 / Z X C V</span></div><section id="pads" class="pads" aria-label="사운드패드"></section>
<div class="device-foot"><span>기본 음성: 한국어 TTS</span><span>패드 아래 + 버튼으로 음성 교체</span></div>
<section class="sequencer"><div class="seq-head"><h2>반복 재생 <span>8박자</span></h2><div class="controls"><label>BPM <input id="bpm" type="number" min="60" max="180" value="100"></label><button id="play">▶ 루프 시작</button><button id="clear" class="small">비우기</button></div></div><div id="steps" class="steps" aria-label="8단계 시퀀서"></div><p class="hint">칸을 누를 때마다 소리가 바뀝니다.</p></section></section>
<div class="below"><p id="status" role="status" aria-live="polite">준비됨</p><span>Q W E R · A S D F · Z X C V</span></div><footer>원본 밈 음성은 아직 수록되지 않았습니다. 직접 넣은 파일은 이 탭에서만 사용됩니다.</footer></main><script src="app.js"></script></body></html>
